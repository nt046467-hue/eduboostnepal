    </script>
    <style>*,*::before,*::after{box-sizing:border-box}body{margin:0;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}.glass{background:rgba(255,255,255,0.05);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.1)}.gradient-text{background:linear-gradient(135deg,#fb923c,#f97316,#dc2626);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.btn-primary{background:linear-gradient(135deg,#f97316,#dc2626);cursor:pointer;border:none;-webkit-appearance:none;appearance:none}.btn-primary:hover{opacity:0.9;transform:translateY(-1px)}.btn-primary:active{transform:translateY(0)}.btn-primary:disabled{opacity:0.6;cursor:not-allowed;transform:none}.input-field{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);transition:border-color 0.2s;-webkit-appearance:none;appearance:none;font-size:16px!important}.input-field:focus{border-color:#f97316;outline:none;box-shadow:0 0 0 3px rgba(249,115,22,0.1)}.role-card{cursor:pointer;transition:all 0.25s;border:2px solid rgba(255,255,255,0.1);border-radius:14px;padding:16px 12px;text-align:center;-webkit-tap-highlight-color:transparent}.role-card.selected{border-color:#f97316;background:rgba(249,115,22,0.1)}.role-card:hover{border-color:rgba(249,115,22,0.5)}.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.nepal-stripe{background:linear-gradient(90deg,#003893 50%,#dc143c 50%);height:4px;width:100%}.eb-theme-toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:100px;padding:5px 12px 5px 7px;transition:border-color 0.2s,background 0.2s;user-select:none;position:absolute;top:14px;right:16px;z-index:10}.eb-theme-toggle-track{width:34px;height:19px;background:rgba(255,255,255,0.18);border-radius:100px;position:relative;transition:background 0.3s;flex-shrink:0}.eb-theme-toggle-thumb{position:absolute;top:2px;left:2px;width:15px;height:15px;background:#fff;border-radius:50%;transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 1px 4px rgba(0,0,0,0.25)}.eb-theme-toggle-icon{font-size:12px;line-height:1}.eb-theme-toggle-lbl{font-size:0.7rem;color:rgba(255,255,255,0.55);letter-spacing:0.03em;white-space:nowrap}.page-wrapper{min-height:100vh;display:flex;flex-direction:column;position:relative}.form-area{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:60px 16px 40px}.form-card{width:100%;max-width:440px}.card-inner{padding:28px 28px}@media (max-width:400px){.card-inner{padding:20px 16px}.form-area{padding:56px 12px 32px}}.logo-section{text-align:center;margin-bottom:24px}.logo-section a{display:inline-flex;align-items:center;gap:12px;margin-bottom:14px;text-decoration:none}.logo-section h1{font-size:1.5rem;font-weight:700;margin:0 0 6px}.logo-section p{font-size:0.85rem;margin:0}@media (max-width:360px){.logo-section h1{font-size:1.2rem}}.form-space{display:flex;flex-direction:column;gap:16px}.form-label{display:block;font-size:0.85rem;font-weight:500;margin-bottom:8px;color:#cbd5e1}.input-wrap{position:relative}.pw-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px;font-size:18px;color:#94a3b8;line-height:1}.pw-toggle:hover{color:#fff}.terms-row{display:flex;align-items:flex-start;gap:10px;font-size:0.82rem;cursor:pointer}.terms-row input[type="checkbox"]{margin-top:2px;flex-shrink:0}.pw-strength{margin-top:8px}.pw-bars{display:flex;gap:4px;margin-bottom:4px}.pw-bar{height:4px;flex:1;border-radius:4px;background:#1e293b;transition:background 0.2s}.pw-label{font-size:0.75rem;color:#64748b}select.input-field{color:inherit}#authMessage{display:none;margin-bottom:16px;padding:12px 16px;border-radius:12px;font-size:0.85rem;text-align:center;font-weight:500}#authMessage.show-error{display:block;background:rgba(239,68,68,0.12);color:#fca5a5;border:1px solid rgba(239,68,68,0.3)}#authMessage.show-ok{display:block;background:rgba(34,197,94,0.12);color:#86efac;border:1px solid rgba(34,197,94,0.3)}.bottom-link{text-align:center;font-size:0.85rem;margin-top:18px}input[type="checkbox"]{width:16px;height:16px;accent-color:#f97316;cursor:pointer}html.light body{background-color:#f1f5f9;color:#0f172a}html.light .glass{background:rgba(255,255,255,0.85);border-color:rgba(0,0,0,0.08)}html.light .text-white,html.light .logo-section h1{color:#0f172a}html.light .text-slate-300,.form-label{color:#334155}html.light .text-slate-400,.logo-section p,.bottom-link{color:#64748b}html.light .input-field{background:#fff!important;color:#0f172a!important;border-color:#cbd5e1!important}html.light .input-field::placeholder{color:#94a3b8}html.light select.input-field{color:#0f172a!important}html.light .role-card{border-color:#cbd5e1}html.light .role-card.selected{border-color:#f97316;background:rgba(249,115,22,0.08)}html.light .eb-theme-toggle{background:rgba(0,0,0,0.04);border-color:rgba(0,0,0,0.12)}html.light .eb-theme-toggle-track{background:#6366f1}html.light .eb-theme-toggle-thumb{transform:translateX(15px)}html.light .eb-theme-toggle-lbl{color:rgba(0,0,0,0.45)}html.light .pw-toggle{color:#64748b}html.light .pw-bar{background:#e2e8f0}</style>

    <style>*,*::before,*::after{box-sizing:border-box}html,body{overflow-x:hidden;max-width:100%}img,video,iframe,embed,object{max-width:100%;height:auto}table{width:100%;overflow-x:auto;display:block}pre,code{overflow-x:auto;white-space:pre-wrap;word-break:break-word}@media (max-width:640px){h1{font-size:clamp(1.5rem,5vw,2.5rem)!important}h2{font-size:clamp(1.1rem,4vw,1.8rem)!important}.text-4xl{font-size:clamp(1.5rem,6vw,2.25rem)!important}.text-5xl{font-size:clamp(1.8rem,7vw,3rem)!important}.text-6xl{font-size:clamp(2rem,8vw,3.75rem)!important}}</style>
<link rel="stylesheet" href="/css/design-system.css" />
</head>
  <body
    class="bg-slate-950 text-white font-sans"
  >
    <div class="page-wrapper">
      <div class="nepal-stripe"></div>

      <!-- Theme toggle -->

      <div class="form-area">
        <div class="form-card">
          <!-- Logo -->
          <div class="logo-section">
            <a href="../index.html">
              <img
                loading="lazy"
                src="../public/favicon.png"
                alt="EduBoost Nepal"
                style="
                  width: 48px;
                  height: 48px;
                  border-radius: 14px;
                  object-fit: cover;
                "
              />
              <span style="font-size: 1.35rem; font-weight: 700"
                >EduBoost <span style="color:#B91C2C">Nepal</span></span
              >
            </a>
            <h1 class="text-white">Create your account</h1>
            <p class="text-slate-400">
              Start your free NEB exam prep journey today
            </p>
          </div>

          <!-- Signup Card -->
          <div class="eb-card" style="border-radius:24px">
            <div class="card-inner">
              <div id="authMessage"></div>

            <!-- Role Selection -->
            <div style="margin-bottom: 20px">
              <label class="form-label">I am a...</label>
              <div class="role-grid">
                <div
                  class="role-card selected"
                  id="roleStudent"
                  onclick="selectRole('student')"
                >
                  <div style="font-size: 1.6rem; margin-bottom: 6px">🎓</div>
                  <div style="font-weight: 600; font-size: 0.875rem">
                    Student
                  </div>
                  <div
                    class="text-slate-400"
                    style="font-size: 0.75rem; margin-top: 4px"
                  >
                    Class 11-12
                  </div>
                </div>
                <div
                  class="role-card"
                  id="roleTeacher"
                  onclick="selectRole('teacher')"
                >
                  <div style="font-size: 1.6rem; margin-bottom: 6px">👨‍🏫</div>
                  <div style="font-weight: 600; font-size: 0.875rem">
                    Teacher
                  </div>
                  <div
                    class="text-slate-400"
                    style="font-size: 0.75rem; margin-top: 4px"
                  >
                    Educator
                  </div>
                </div>
              </div>
            </div>
            <input type="hidden" id="selectedRole" value="student" />

            <form
              id="signupForm"
              class="form-space"
              onsubmit="handleSignup(event)"
            >
              <div>
                <label class="form-label">Full Name</label>
                <input
                  id="signupName"
                  type="text"
                  required
                  placeholder="Ram Bahadur Shrestha"
                  autocomplete="name"
                  class="input-field text-white"
                  style="
                    width: 100%;
                    padding: 14px 16px;
                    border-radius: 12px;
                    color: inherit;
                  "
                />
              </div>

              <div>
                <label class="form-label">Email Address</label>
                <input
                  id="signupEmail"
                  type="email"
                  required
                  placeholder="your@email.com"
                  autocomplete="email"
                  class="input-field text-white"
                  style="
                    width: 100%;
                    padding: 14px 16px;
                    border-radius: 12px;
                    color: inherit;
                  "
                />
              </div>

              <div id="classSelectWrapper">
                <label class="form-label">Class</label>
                <select
                  id="signupClass"
                  class="input-field text-white"
                  style="
                    width: 100%;
                    padding: 14px 16px;
                    border-radius: 12px;
                    color: inherit;
                    cursor: pointer;
                  "
                >
                  <option value="11">Class 11</option>
                  <option value="12">Class 12</option>
                </select>
              </div>

              <div>
                <label class="form-label">Password</label>
                <div class="input-wrap">
                  <input
                    id="signupPassword"
                    type="password"
                    required
                    placeholder="Min. 8 characters"
                    autocomplete="new-password"
                    class="input-field text-white"
                    style="
                      width: 100%;
                      padding: 14px 48px 14px 16px;
                      border-radius: 12px;
                      color: inherit;
                    "
                  />
                  <button
                    type="button"
                    id="signupPasswordToggle"
                    onclick="togglePasswordVisibility('signupPassword','signupPasswordToggle')"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-orange-400 transition-colors p-1 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400/30"
                    aria-label="Toggle password visibility"
                  >
                    <svg id="signupPasswordToggle-eye-open" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg id="signupPasswordToggle-eye-closed" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                  </button>
                </div>
                <!-- Password strength -->
                <div
                  id="passwordStrength"
                  class="pw-strength"
                  style="display: none"
                >
                  <div class="pw-bars">
                    <div class="pw-bar" id="str1"></div>
                    <div class="pw-bar" id="str2"></div>
                    <div class="pw-bar" id="str3"></div>
                    <div class="pw-bar" id="str4"></div>
                  </div>
                  <div id="strLabel" class="pw-label"></div>
                </div>
              </div>

              <div>
                <label class="form-label">Confirm Password</label>
                <div class="input-wrap">
                  <input
                    id="confirmPassword"
                    type="password"
                    required
                    placeholder="Repeat password"
                    autocomplete="new-password"
                    class="input-field text-white"
                    style="
                      width: 100%;
                      padding: 14px 48px 14px 16px;
                      border-radius: 12px;
                      color: inherit;
                    "
                  />
                  <button
                    type="button"
                    id="confirmPasswordToggle"
                    onclick="togglePasswordVisibility('confirmPassword','confirmPasswordToggle')"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-orange-400 transition-colors p-1 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400/30"
                    aria-label="Toggle password visibility"
                  >
                    <svg id="confirmPasswordToggle-eye-open" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg id="confirmPasswordToggle-eye-closed" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                  </button>
                </div>
              </div>

              <label class="terms-row text-slate-400" style="cursor: pointer">
                <input type="checkbox" id="agreeTerms" required />
                <span
                  >I agree to the
                  <a
                    href="terms.html"
                    style="color: #fb923c; text-decoration: none"
                    >Terms of Service</a
                  >
                  and
                  <a
                    href="privacy.html"
                    style="color: #fb923c; text-decoration: none"
                    >Privacy Policy</a
                  >
                </span>
              </label>

              <button
                type="submit"
                id="signupBtn"
                class="btn-primary text-white"
                style="
                  width: 100%;
                  padding: 15px;
                  border-radius: 12px;
                  font-weight: 700;
                  font-size: 0.95rem;
                  font-family: inherit;
                  transition: all 0.2s;
                "
              >
                Create Account →
              </button>
            </form>

            <p class="bottom-link text-slate-400">
              Already have an account?
              <a
                href="login.html"
                style="
                  color: #fb923c;
                  font-weight: 600;
                  text-decoration: none;
                  margin-left: 4px;
                "
                >Log in →</a
              >
            </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      if (!firebase.apps.length) {
        firebase.initializeApp(FIREBASE_CONFIG);
      }
      const auth = firebase.auth();
      const db = firebase.firestore();
      db.enableNetwork().catch(() => {});

      // NOTE: Do NOT redirect here on auth state change.
      // The signup flow handles its own redirect AFTER Firestore save completes.
      // Redirecting here would abort the Firestore write mid-flight.

      function selectRole(role) {
        document.getElementById("selectedRole").value = role;
        document
          .getElementById("roleStudent")
          .classList.toggle("selected", role === "student");
        document
          .getElementById("roleTeacher")
          .classList.toggle("selected", role === "teacher");
        document.getElementById("classSelectWrapper").style.display =
          role === "student" ? "block" : "none";
      }

      // Password strength checker
      document
        .getElementById("signupPassword")
        .addEventListener("input", function () {
          const p = this.value;
          const strengthEl = document.getElementById("passwordStrength");
          if (!p) {
            strengthEl.style.display = "none";
            return;
          }
          strengthEl.style.display = "block";

          let score = 0;
          if (p.length >= 8) score++;
          if (/[A-Z]/.test(p)) score++;
          if (/[0-9]/.test(p)) score++;
          if (/[^A-Za-z0-9]/.test(p)) score++;

          const colors = ["#ef4444", "#f97316", "#eab308", "#22c55e"];
          const labels = ["Weak", "Fair", "Good", "Strong"];

          ["str1", "str2", "str3", "str4"].forEach((id, i) => {
            document.getElementById(id).style.background =
              i < score ? colors[score - 1] : "";
            document.getElementById(id).classList.toggle("active", i < score);
          });
          document.getElementById("strLabel").textContent =
            labels[score - 1] || "";
        });

      function showMessage(msg, isError = false) {
        const el = document.getElementById("authMessage");
        el.textContent = msg;
        el.className = isError ? "show-error" : "show-ok";
      }

      async function handleSignup(e) {
        e.preventDefault();
        const name = document.getElementById("signupName").value.trim();
        const email = document.getElementById("signupEmail").value.trim();
        const password = document.getElementById("signupPassword").value;
        const confirm = document.getElementById("confirmPassword").value;
        const role = document.getElementById("selectedRole").value;
        const classLevel =
          document.getElementById("signupClass")?.value || null;

        if (password !== confirm) {
          showMessage("Passwords do not match.", true);
          return;
        }
        if (password.length < 8) {
          showMessage("Password must be at least 8 characters.", true);
          return;
        }

        const btn = document.getElementById("signupBtn");
        btn.disabled = true;
        btn.textContent = "Creating account...";

        try {
          const cred = await auth.createUserWithEmailAndPassword(
            email,
            password,
          );
          await cred.user.updateProfile({ displayName: name });

          // Force token refresh so Firestore auth is fully ready before writing
          await cred.user.getIdToken(true);

          // Retry up to 3 times in case Firestore is momentarily slow
          let saved = false;
          for (let attempt = 0; attempt < 3; attempt++) {
            try {
              await db
                .collection("users")
                .doc(cred.user.uid)
                .set({
                  name,
                  email,
                  role,
                  class: role === "student" ? classLevel || "11" : null,
                  createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                  savedContent: [],
                  activityCount: 0,
                });
              saved = true;
              break;
            } catch (fsErr) {
              if (attempt < 2) {
                await new Promise((r) => setTimeout(r, 800));
              } else {
                console.warn(
                  "Firestore save failed after 3 attempts:",
                  fsErr.message,
                );
                // Still proceed — auth succeeded, profile can be created on next login
              }
            }
          }

          showMessage("Account created! Redirecting to dashboard...");
          setTimeout(() => (window.location.href = "dashboard.html"), 1200);
        } catch (err) {
          const msgs = {
            "auth/email-already-in-use":
              "An account with this email already exists.",
            "auth/invalid-email": "Please enter a valid email address.",
            "auth/weak-password":
              "Password is too weak. Use at least 8 characters.",
          };
          showMessage(msgs[err.code] || err.message, true);
          btn.disabled = false;
          btn.textContent = "Create Account →";
        }
      }

      function togglePasswordVisibility(inputId, btnId) {
        const input = document.getElementById(inputId);
        const isHidden = input.type === "password";
        input.type = isHidden ? "text" : "password";
        if (btnId) {
          const openEye = document.getElementById(btnId + "-eye-open");
          const closedEye = document.getElementById(btnId + "-eye-closed");
          if (openEye) openEye.classList.toggle("hidden", isHidden);
          if (closedEye) closedEye.classList.toggle("hidden", !isHidden);
        }
      }
    </script>
  </body>
</html>
