    <script>
      // ── Firebase init ─────────────────────────────────────────────
      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();
      const db = firebase.firestore();
      db.settings({ experimentalForceLongPolling: false, merge: true });
      db.enableNetwork().catch(() => {});

      // Ensure session persists across page refreshes (up to browser session)
      auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});

      const urlParams = new URLSearchParams(window.location.search);
      const returnUrl = urlParams.get("returnUrl");
      const REDIRECT_AFTER_LOGIN = returnUrl
        ? decodeURIComponent(returnUrl)
        : "dashboard.html";

      // ── THE FIX ───────────────────────────────────────────────────
      // Firebase calls onAuthStateChanged once immediately when it
      // knows the auth state. We wait for that single call:
      //   • If user IS logged in  → redirect to dashboard (they shouldn't be here)
      //   • If user is NOT logged in → hide the overlay and show the form
      //
      // The key is `authResolved` flag so we never redirect twice, and
      // we never redirect during the form submission flow either.
      let authResolved = false;
      let isRedirecting = false;

      // Check if we're mid-redirect from Google (don't flash the form)
      const isReturningFromRedirect =
        document.referrer.includes("accounts.google.com") ||
        window.location.hash.includes("state=") ||
        sessionStorage.getItem("googleRedirectPending") === "1";

      const unsubscribe = auth.onAuthStateChanged((user) => {
        if (authResolved) return;
        authResolved = true;
        unsubscribe();

        if (user && !isRedirecting) {
          // Already logged in — go straight to dashboard
          isRedirecting = true;
          window.location.replace(REDIRECT_AFTER_LOGIN);
        } else if (!isRedirecting) {
          // Not logged in — show the form (but only if we're not mid-redirect)
          document.getElementById("authCheckOverlay").style.display = "none";
        }
      });

      // Safety fallback: if Firebase takes >6s, hide overlay anyway
      setTimeout(() => {
        const overlay = document.getElementById("authCheckOverlay");
        if (overlay && overlay.style.display !== "none" && !isRedirecting) {
          overlay.style.display = "none";
        }
      }, 6000);

      // ── Login with email/password ─────────────────────────────────
      async function handleLogin(e) {
        e.preventDefault();
        if (isRedirecting) return;

        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;

        setLoading(true);
        try {
          await auth.signInWithEmailAndPassword(email, password);
          showMessage("Login successful! Redirecting…");
          isRedirecting = true;
          setTimeout(() => window.location.replace(REDIRECT_AFTER_LOGIN), 800);
        } catch (err) {
          const msgs = {
            "auth/user-not-found": "No account found with this email.",
            "auth/wrong-password": "Incorrect password. Please try again.",
            "auth/invalid-email": "Please enter a valid email address.",
            "auth/invalid-credential": "Email or password is incorrect.",
            "auth/too-many-requests":
              "Too many attempts. Please try again later.",
          };
          showMessage(msgs[err.code] || err.message, true);
          setLoading(false);
        }
      }

      // ── Google Sign In ────────────────────────────────────────────
      // Called on page load to catch any redirect result (fallback path when popup was blocked)
      auth
        .getRedirectResult()
        .then(async (result) => {
          sessionStorage.removeItem("googleRedirectPending");
          if (!result || !result.user) return;
          showMessage("Google sign-in successful! Redirecting…");
          await saveGoogleUserProfile(result.user);
          isRedirecting = true;
          window.location.replace(REDIRECT_AFTER_LOGIN);
        })
        .catch((err) => {
          sessionStorage.removeItem("googleRedirectPending");
          if (err.code && err.code !== "auth/credential-already-in-use") {
            document.getElementById("authCheckOverlay").style.display = "none";
            showMessage("Google sign-in failed: " + err.message, true);
          }
        });

      async function saveGoogleUserProfile(user) {
        try {
          await db.enableNetwork().catch(() => {});
          let retries = 3;
          while (retries > 0) {
            try {
              const userRef = db.collection("users").doc(user.uid);
              const doc = await userRef.get();
              if (!doc.exists) {
                await userRef.set({
                  name: user.displayName || "",
                  email: user.email || "",
                  role: "student",
                  photoURL: user.photoURL || "",
                  createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                  savedContent: [],
                  activityCount: 0,
                });
              }
              break;
            } catch (fsErr) {
              retries--;
              if (retries === 0) {
                console.warn("Firestore profile save failed:", fsErr.message);
              } else {
                await new Promise((r) => setTimeout(r, 800));
              }
            }
          }
        } catch (e) {
          console.warn("saveGoogleUserProfile error:", e.message);
        }
      }

      async function handleGoogleLogin() {
        if (isRedirecting) return;
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.addScope("email");
        provider.addScope("profile");
        provider.setCustomParameters({ prompt: "select_account" });

        // Use popup for ALL devices — redirect flow breaks on Netlify
        // because Firebase redirect requires authDomain to match the hosting domain.
        try {
          showMessage("Opening Google sign-in…");
          const result = await auth.signInWithPopup(provider);
          showMessage("Google sign-in successful! Redirecting…");
          await saveGoogleUserProfile(result.user);
          isRedirecting = true;
          window.location.replace(REDIRECT_AFTER_LOGIN);
        } catch (err) {
          if (err.code === "auth/popup-blocked") {
            // Popup was blocked — fall back to redirect
            try {
              showMessage("Popup blocked, trying redirect…");
              sessionStorage.setItem("googleRedirectPending", "1");
              await auth.signInWithRedirect(provider);
            } catch (redirectErr) {
              showMessage(
                "Google sign-in failed: " + redirectErr.message,
                true,
              );
            }
          } else if (
            err.code !== "auth/popup-closed-by-user" &&
            err.code !== "auth/cancelled-popup-request"
          ) {
            showMessage("Google sign-in failed: " + err.message, true);
          }
        }
      }

      // ── Forgot password ───────────────────────────────────────────
      async function handleForgotPassword() {
        const email = document.getElementById("loginEmail").value.trim();
        if (!email) {
          showMessage("Please enter your email address first.", true);
          return;
        }
        try {
          await auth.sendPasswordResetEmail(email);
          showMessage("Password reset email sent! Check your inbox.");
        } catch (err) {
          showMessage("Failed to send reset email: " + err.message, true);
        }
      }

      // ── Helpers ───────────────────────────────────────────────────
      function showMessage(msg, isError = false) {
        const el = document.getElementById("authMessage");
        el.textContent = msg;
        el.className = isError ? "show-error" : "show-ok";
      }

      function setLoading(loading) {
        const btn = document.getElementById("loginBtn");
        btn.disabled = loading;
        btn.textContent = loading ? "Signing in…" : "Sign In →";
        btn.style.opacity = loading ? "0.7" : "1";
      }

      function togglePasswordVisibility(inputId, btnId) {
        const input = document.getElementById(inputId);
        const isHidden = input.type === "password";
        input.type = isHidden ? "text" : "password";
        if (btnId) {
          const openEye = document.getElementById(btnId + "-eye-open");
          const closedEye = document.getElementById(btnId + "-eye-closed");
          if (openEye) openEye.classList.toggle("hidden", isHidden);
          if (closedEye) closedEye.classList.toggle("hidden", !isHidden);
        }
      }
    </script>
  </body>
</html>
